name: RAG Evaluation Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit python-dotenv groq yt-dlp pydub langchain-mistralai langchain-chroma langchain-community langchain-text-splitters langchain-experimental sentence-transformers chromadb ragas datasets pandas numpy rank_bm25 flashrank

      - name: Run RAG Evaluation Benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python evals/benchmark_methods.py
